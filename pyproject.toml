[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-librpa-mcp"
version = "0.2.0"
description = "Deterministic validation and controlled execution for ABACUS, LibRPA, and PyATB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "AroundPeking", email = "gonghuanjing@iphy.ac.cn"},
]
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "numpy>=1.26",
]

[project.scripts]
oh-my-librpa-mcp = "oml_mcp.server:main"

[tool.setuptools.packages.find]
include = ["oml_mcp*"]

[tool.setuptools.package-data]
oml_mcp = [
  "profiles/*.json",
  "benchmarks/*.json",
  "execution_profiles_registry/*.json",
  "scientific_benchmarks/*.json",
]
