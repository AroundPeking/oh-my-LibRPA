[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-librpa-mcp"
version = "0.1.0"
description = "Deterministic read-only checks for ABACUS, LibRPA, and PyATB workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "AroundPeking", email = "gonghuanjing@iphy.ac.cn"},
]
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "numpy>=1.26",
]

[project.scripts]
oh-my-librpa-mcp = "oml_mcp.server:main"

[tool.setuptools.packages.find]
include = ["oml_mcp*"]
