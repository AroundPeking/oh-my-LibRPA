[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-librpa-mcp"
version = "0.4.11"
description = "Deterministic validation and controlled execution for ABACUS, LibRPA, and PyATB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "AroundPeking", email = "gonghuanjing@iphy.ac.cn"},
]
dependencies = [
  # mcp 2.1+ wraps tool exceptions into a generic "Error executing tool <name>"
  # message, which drops the domain error text the tool contract and tests rely on.
  "mcp>=2.0,<2.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = []

[project.scripts]
oh-my-librpa-mcp = "oml_mcp.server:main"

[tool.setuptools.packages.find]
include = ["oml_mcp*"]

[tool.setuptools.package-data]
oml_mcp = [
  "profiles/*.json",
  "admission_manifests/*.json",
  "benchmark_suites/*.json",
  "benchmarks/*.json",
  "execution_profiles_registry/*.json",
  "route_benchmarks/*.json",
  "scientific_benchmarks/*.json",
  "material_classes/*.json",
  "known_issues/*.json",
  "parameter_prescriptions/*.json",
  "parameter_knowledge/*.json",
  "retry_rules/*.json",
  "fast_cases/*.json",
]
