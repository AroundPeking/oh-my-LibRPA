- id: gw-molecule-branch-301
  scene: User requests GW for a molecular system
  symptom: Need a molecule-specific workflow path instead of the solid-state default chain
  root_cause: Molecules skip the DF/pyatb stage, and some builds need route-aware handling of `gamma_only`
  fix:
    - Set `KPT` to `1 1 1`
    - Treat `gamma_only` as a route-aware option instead of a universal hard rule
    - Use official ABACUS input parameter names from the ABACUS input documentation
    - Do not run `pyatb`, `NSCF`, or `preprocess_abacus_for_librpa_band.py`
    - Set `replace_w_head = f` in `librpa.in`
    - Set `use_symmetry_exx = f` and `use_symmetry_gw = f` in `librpa.in`
    - Materialize the tested short smoke route with `scripts/materialize_gw_template.sh --case-dir <case_dir> --system-type molecule --needs-nscf false --needs-pyatb false --use-shrink-abfs false` instead of copying the generic template by hand
  verify:
    - Confirm `KPT` is `1 1 1`
    - Confirm `replace_w_head = f` in `librpa.in`
    - Confirm no `pyatb_librpa_df`, NSCF, or preprocess stage is inserted into the workflow
    - Confirm input symmetry flags are disabled in `librpa.in`
    - Confirm the selected output set is internally consistent with the chosen `gamma_only` setting
  applies_to:
    mode: gw
    system_type: molecule

- id: gw-solid-branch-302
  scene: User requests GW for a solid-state system
  symptom: Need the full periodic workflow with dielectric preprocessing and band-path preparation
  root_cause: Solids require k-point sampling, DF generation, and NSCF band-path preprocessing
  fix:
    - Ask for `KPT` mesh size; default to `8 8 8`
    - Require the user to define `KPT_nscf`
    - Run `SCF`
    - Run `pyatb` to generate `pyatb_librpa_df`
    - Run `NSCF`
    - Run `preprocess_abacus_for_librpa_band.py`
    - Run `LibRPA`
    - Prefer a user-curated server-side reference bundle when available
  verify:
    - Confirm the chosen `KPT` mesh in `KPT`
    - Confirm `KPT_nscf` is provided by the user
    - Confirm the `pyatb_librpa_df` directory is generated after `pyatb`
    - Confirm band information files are generated before `LibRPA`
  applies_to:
    mode: gw
    system_type: solid

- id: gw-metal-solid-branch-303
  scene: User requests GW for a three-dimensional metal (bulk Na, Mg, Al, Si beta-Sn, ...)
  symptom: A semiconductor-shaped input runs but fails at the static q=0 channel, or exits 0 with an unregularized band that must not be reported
  root_cause: >-
    Metals add four physics requirements that a semiconductor input does not carry:
    fractional Fermi-Dirac occupations that must stay consistent from SCF to LibRPA,
    an intraband q->0 channel governed by -df/de, a non-commuting static/dynamic limit,
    and analytic continuation that dominates the final number. The solid branch above
    still applies; this card adds only what differs.
  fix:
    - Keep the solid chain SCF -> NSCF(reader-v1) -> LibRPA; metals do not need pyatb when ABACUS writes velocity_matrix directly
    - Use `smearing_method fd` in SCF and NSCF, and set `smearing_sigma` from the chosen temperature with kB = 3.166811563455607e-6 Ha/K (300 K -> 1.9000869380733278e-3 Ry, 316 K -> 2.0e-3 Ry)
    - Set the LibRPA sparse-IR beta from the same temperature (300 K -> beta = 1052.5834160135762 Ha^-1); LibRPA enforces abs(beta * kBT - 1) <= 1e-10 and aborts otherwise
    - Set `option_dielect_func = 3` and `replace_w_head = t`
    - Leave `use_2d_dielectric = f`; do NOT set `out_librpa_3d_coulomb_method direct_reciprocal` (it takes an early return and writes only the cut prefix)
    - Set `rpa_out_vel 1` in the NSCF input; replace_w_head needs the velocity matrix and LibRPA aborts with "Cannot find moment files for head/wing calculation" without it
    - Size the response grid so `wmax >= max(E) - min(E)` over the whole SCF grid, in Hartree, and set `nfreq`/`ntau` equal to the grid header
    - Make the response `rpa_wmax` equal the GW `w_wmax`; otherwise LibRPA aborts with "thermal GW bosonic sample missing from chi0 frequency grid"
    - Use a square MPI/BLACS grid (4, 9, 16, 25 ...); 8 factors to 2x4 and aborts at the thermal Wc stage after the whole chi0 has been paid for
    - Take PP/NAO/ABF from the LibRPA database (`list_basis_sets`, `get_material`) and record the set id and payload SHA-256
    - Set `n_params_anacon = -1` so the driver writes all continuation data, then report the band from a separate regularized replay, not from the native table
  verify:
    - Confirm SCF smearing_sigma and the LibRPA grid beta encode the same temperature
    - Confirm `Wing_lambda diagnostics` appears exactly once in the rank-0 log
    - Confirm both `v1_coulomb_full_iq_*` and `v1_coulomb_cut_iq_*` exist
    - Confirm adjacent-k QP-correction steps stay below 0.05 eV within +/-1 eV of the Fermi level on the replayed band
    - Confirm the frontier-bandwidth GW/PBE ratio lands inside 1.0-1.3
    - Confirm native and replayed outputs are labelled separately and neither was smoothed or re-rooted
  applies_to:
    mode: gw
    system_type: metal_3d

- id: gw-metal-2d-branch-304
  scene: User requests GW for a two-dimensional metal (doped graphene, monolayer Ga, ...)
  symptom: The 2D route runs but the static Gamma Schur coefficient fails a realness guard, or the intraband channel is silently dropped
  root_cause: >-
    A 2D metal needs both the strict-2D Ewald treatment and the metallic static channel.
    The 1/q Schur coefficient at Gamma is real by construction; whatever imaginary part
    survives comes from the input chi0, not from physics.
  fix:
    - Take the strict-2D Ewald route (`out_librpa_2d_coulomb_method ewald`, `exx_ewald_lambda .25`) and keep the full regular head/wing grid, as the 2D card of `abacus-librpa-strict2d-ewald-headwing` requires
    - Add the whole `gw-metal-solid-branch-303` contract on top: fd smearing, matched beta, option_dielect_func=3, replace_w_head=t, rpa_out_vel=1, square MPI grid, database basis
    - Set `use_2d_dielectric = t`
    - Keep the spacer at the converged value and do not trade it for a different k mesh in the same comparison
    - If the run aborts with "metallic static 2D Schur 1/q coefficient is not positive real", read the diagnostic it prints: a relative imaginary part near 1e-8 with a real part of order 1e2 is a numerical-realness failure of an IBZ/k-star-averaged chi0 (that average carries about 2e-4 non-Hermiticity), not a divergent screening response. Compare |Im| against max(1e-8, 1e-6*max(|v|,|kappa|)) and fix the upstream non-Hermiticity rather than only the threshold
    - Doped 2D systems inherit the whole contract; neutral 2D metals do not need nelec_delta but keep every other item
  verify:
    - Confirm `use_2d_dielectric = t` together with the strict-2D Ewald settings
    - Confirm the 144-point (or converged) head/wing grid is intact, not reduced to an IBZ subset
    - Confirm `Wing_lambda diagnostics` appears exactly once
    - Confirm the QP band passes the same smoothness and bandwidth-ratio gates as the 3D branch
  applies_to:
    mode: gw
    system_type: metal_2d
